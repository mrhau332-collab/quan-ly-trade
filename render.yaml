services:
  - type: web
    name: quan-ly-trade
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: db-volume
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/db.json
